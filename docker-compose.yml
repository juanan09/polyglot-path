services:
  # ==========================================
  # 🐘 Base de Datos: PostgreSQL 16 LTS
  # ==========================================
  polyglot-db:
    image: postgres:16-alpine
    container_name: polyglot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polyglot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polyglot123}
      POSTGRES_DB: ${POSTGRES_DB:-polyglot_path}
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polyglot} -d ${POSTGRES_DB:-polyglot_path}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 📊 pgAdmin: Gestión visual de la BD
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: polyglot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@polyglot.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      polyglot-db:
        condition: service_healthy

  # ==========================================
  # 🌐 Frontend + Backend (Nuxt 4 / Nitro)
  # ==========================================
  polyglot-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner  # En producción usa el runner. En local se sobrescribirá por la base.
    container_name: polyglot-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-polyglot}:${POSTGRES_PASSWORD:-polyglot123}@polyglot-db:5432/${POSTGRES_DB:-polyglot_path}
      - USE_OLLAMA=${USE_OLLAMA:-false}
      - OLLAMA_HOST=http://polyglot-ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-phi4-mini}
    ports:
      - "3000:3000"
    depends_on:
      polyglot-db:
        condition: service_healthy
      polyglot-migrator:
        condition: service_completed_successfully

  # ==========================================
  # 🚀 Migrador Automático de Base de Datos
  # ==========================================
  polyglot-migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # En prod usa el código que tiene package.json y las migraciones locales
    container_name: polyglot-migrator
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-polyglot}:${POSTGRES_PASSWORD:-polyglot123}@polyglot-db:5432/${POSTGRES_DB:-polyglot_path}
    command: pnpm run db:migrate
    depends_on:
      polyglot-db:
        condition: service_healthy

  # ==========================================
  # 🦙 Ollama: Local LLM Server
  # ==========================================
  polyglot-ollama:
    image: ollama/ollama:latest
    container_name: polyglot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles:
      - ollama

  # Helper: descarga el modelo automáticamente la primera vez
  ollama-pull:
    image: ollama/ollama:latest
    container_name: polyglot-ollama-pull
    depends_on:
      polyglot-ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-phi4-mini}"]
    environment:
      - OLLAMA_HOST=http://polyglot-ollama:11434
    restart: "no"
    profiles:
      - ollama

volumes:
  pgdata:
  ollama_data:
